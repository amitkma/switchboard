name: Bug report
description: Something crashes, or doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include what you expected to happen instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Settings
        2. Click Add Rule
        3. ...
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Switchboard version
      placeholder: 1.0.0, or a commit if you built from source
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "15.3"
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Downloaded from GitHub Releases
        - Built from source in Xcode
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Crash report or logs
      description: Optional. Crash reports are in Console under Crash Reports. Remove anything private first.
      render: text
