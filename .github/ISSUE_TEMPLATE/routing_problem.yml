name: Link opened in the wrong browser
description: A link matched the wrong rule, or a browser is missing from the list
labels: [bug]
body:
  - type: markdown
    attributes:
      value: This repository is public. Replace private addresses and remove tokens, paths and query strings from links.
  - type: textarea
    id: link
    attributes:
      label: Link
      description: A link that shows the problem. The domain usually matters most.
      placeholder: https://docs.example.com/
    validations:
      required: true
  - type: textarea
    id: rules
    attributes:
      label: Your rules, in order
      placeholder: |
        github.com -> Google Chrome
        example.com -> Firefox
        Fallback: Safari
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Which browser did you expect?
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: Which browser opened?
      description: If a browser is missing from the list, name it and say which folder it's installed in.
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Switchboard version
      placeholder: 1.0.0, or a commit if you built from source
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
      placeholder: "15.3"
    validations:
      required: true
